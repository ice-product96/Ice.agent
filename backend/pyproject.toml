[project]
name = "ice-agent-backend"
version = "0.1.0"
description = "Ice.agent orchestration backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "pwdlib[argon2]>=0.2",
  "httpx>=0.28",
  "openai>=1.60",
  "telethon>=1.38",
  "python-socks[asyncio]>=2.5",
  "apscheduler>=3.11",
  "tenacity>=9.0",
  "aiolimiter>=1.2",
  "mcp>=1.3",
  "duckduckgo-search>=7.3",
  "cryptography>=45.0",
  "tzdata",
  "audioop-lts>=0.2.1; python_version>='3.13'",
  "websockets>=14.0",
]

[project.optional-dependencies]
mem0 = ["mem0ai>=0.1.60", "fastembed"]
test = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.28", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
