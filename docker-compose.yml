services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ice_agent
      POSTGRES_USER: ice
      POSTGRES_PASSWORD: ice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ice -d ice_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      ICE_DATABASE_URL: postgresql+asyncpg://ice:ice@postgres:5432/ice_agent
      ICE_SESSION_DIR: /app/data/sessions
    volumes:
      - agent_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  ui:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  agent_data:
